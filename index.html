<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Einstiegsliste">
<link rel="apple-touch-icon" href="icon.png">
<title>Einstiegsliste</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c26;
    --border: rgba(255,255,255,0.07);
    --text: #f0eff8;
    --muted: #5a5870;
    --accent: #7c6af7;
    --green: #22c97a;
    --green-bg: rgba(34,201,122,0.08);
    --red: #f05252;
    --red-bg: rgba(240,82,82,0.08);
    --brand-red: #e02020;
    --header-h: 68px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding-bottom: 90px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── HEADER ── */
  header {
    height: var(--header-h);
    background: rgba(10,10,15,0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo-wrap { display: flex; flex-direction: column; gap: 2px; }
  .logo-main { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; color: var(--text); letter-spacing: -0.02em; line-height: 1; }
  .logo-main span { color: var(--brand-red); }
  .logo-sub { font-size: 9px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }

  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .counter { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 28px; color: var(--text); letter-spacing: -0.03em; line-height: 1; }
  .counter-label { font-size: 9px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }

  /* ── LOAD SCREEN ── */
  #load-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - var(--header-h));
    gap: 20px;
    padding: 40px 24px;
    position: relative;
    z-index: 1;
  }

  .load-icon {
    width: 80px; height: 80px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
  }

  .load-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--text);
    text-align: center;
  }

  .load-sub {
    font-size: 14px;
    color: var(--muted);
    text-align: center;
    max-width: 260px;
    line-height: 1.6;
  }

  .load-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 16px 32px;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.04em;
    cursor: pointer;
    border-radius: 12px;
    width: 100%;
    max-width: 300px;
    transition: opacity 0.15s;
  }
  .load-btn:active { opacity: 0.8; }

  #file-input { display: none; }

  .error-box {
    background: rgba(240,82,82,0.1);
    border: 1px solid rgba(240,82,82,0.3);
    color: var(--red);
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    text-align: center;
    max-width: 300px;
    line-height: 1.5;
    display: none;
  }

  /* ── TRIP BANNER ── */
  .trip-banner {
    display: none;
    padding: 12px 20px;
    background: linear-gradient(135deg, rgba(224,32,32,0.1), rgba(224,32,32,0.03));
    border-bottom: 1px solid rgba(224,32,32,0.15);
    position: relative;
    z-index: 1;
  }
  .trip-banner::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--brand-red);
  }
  .trip-title {
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--brand-red);
    letter-spacing: 0.04em;
  }

  /* ── STOP BLOCK ── */
  .stop-block { position: relative; z-index: 1; }

  .stop-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 20px 20px 10px;
    position: sticky;
    top: var(--header-h);
    z-index: 50;
    background: rgba(10,10,15,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .stop-time-pill {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 14px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 17px;
    color: var(--accent);
    flex-shrink: 0;
  }

  .stop-name { font-size: 15px; font-weight: 500; color: var(--text); line-height: 1.3; }
  .stop-count { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* ── PAX ROWS ── */
  .pax-list { padding: 6px 16px 16px; display: flex; flex-direction: column; gap: 6px; }

  .pax-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    user-select: none;
  }
  .pax-row:active { transform: scale(0.98); }
  .pax-row.checked { background: var(--green-bg); border-color: rgba(34,201,122,0.25); }
  .pax-row.absent { background: var(--red-bg); border-color: rgba(240,82,82,0.25); }

  .seat-badge {
    width: 40px; height: 40px;
    border-radius: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 16px;
    color: var(--muted);
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .pax-row.checked .seat-badge { background: rgba(34,201,122,0.15); border-color: rgba(34,201,122,0.3); color: var(--green); }
  .pax-row.absent .seat-badge { background: rgba(240,82,82,0.15); border-color: rgba(240,82,82,0.3); color: var(--red); }

  .pax-name { flex: 1; font-size: 19px; font-weight: 400; color: var(--text); transition: color 0.15s; line-height: 1.2; }
  .pax-row.checked .pax-name { color: var(--green); text-decoration: line-through; text-decoration-color: rgba(34,201,122,0.4); }
  .pax-row.absent .pax-name { color: var(--red); text-decoration: line-through; text-decoration-color: rgba(240,82,82,0.4); }

  .absent-tag {
    display: none;
    font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    color: #ff6060;
    background: rgba(240,82,82,0.25);
    border: 1px solid rgba(240,82,82,0.6);
    padding: 3px 8px; border-radius: 20px; flex-shrink: 0;
  }
  .pax-row.absent .absent-tag { display: block; }

  .check-ring {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.2s;
  }
  .check-ring svg { opacity: 0; transition: opacity 0.15s; }
  .pax-row.checked .check-ring { border-color: var(--green); background: var(--green); box-shadow: 0 0 12px rgba(34,201,122,0.4); }
  .pax-row.checked .check-ring svg { opacity: 1; }
  .pax-row.absent .check-ring { border-color: var(--red); background: var(--red); box-shadow: 0 0 12px rgba(240,82,82,0.4); }

  /* ── BOTTOM BAR ── */
  .bottom-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(10,10,15,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 100;
  }

  .action-btn {
    background: var(--surface2);
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 9px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .action-btn:hover { border-color: var(--muted); color: var(--text); }
  .action-btn.danger:hover { border-color: var(--red); color: var(--red); }

  .progress-track { flex: 1; height: 4px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); border-radius: 4px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); width: 0%; }

  .absent-info { font-size: 10px; color: var(--red); font-weight: 500; white-space: nowrap; display: none; }
</style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <div class="logo-main">Der <span>Riesebyer</span></div>
    <div class="logo-sub">Einstiegsliste</div>
  </div>
  <div class="header-right">
    <span class="counter" id="badge">–</span>
    <span class="counter-label">Eingestiegen</span>
  </div>
</header>

<!-- LOAD SCREEN -->
<div id="load-screen">
  <div class="load-icon">📋</div>
  <div class="load-title">Liste laden</div>
  <div class="load-sub">Wähle die liste.json Datei aus, die du von Claude bekommen hast.</div>
  <div class="error-box" id="error-box"></div>
  <button class="load-btn" onclick="document.getElementById('file-input').click()">📂 Datei auswählen</button>
  <input type="file" id="file-input" accept=".json,application/json" onchange="loadFile(event)">
</div>

<!-- LIST VIEW -->
<div id="list-view" style="display:none">
  <div class="trip-banner" id="trip-banner">
    <div class="trip-title" id="trip-name"></div>
  </div>
  <main id="main"></main>
</div>

<!-- BOTTOM BAR -->
<div class="bottom-bar" id="bottom-bar" style="display:none">
  <button class="action-btn" onclick="resetAll()">↩ Reset</button>
  <div class="progress-track"><div class="progress-fill" id="progress"></div></div>
  <span class="absent-info" id="absent-info"></span>
  <button class="action-btn danger" onclick="clearList()">✕ Liste</button>
</div>

<script>
let total = 0, checked = 0, listKey = '';

function loadFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      buildList(data);
    } catch(err) {
      showError('Ungültige JSON-Datei');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function showError(msg) {
  const box = document.getElementById('error-box');
  box.textContent = msg;
  box.style.display = 'block';
}

function buildList(data) {
  total = 0; checked = 0;
  listKey = 'rl4_' + (data.reiseziel || '') + (data.haltestellen?.[0]?.uhrzeit || '') + (data.haltestellen?.[0]?.fahrgaeste?.[0]?.name || '');

  if (data.reiseziel) {
    document.getElementById('trip-name').textContent = data.reiseziel;
    document.getElementById('trip-banner').style.display = 'block';
    document.title = data.reiseziel;
  }

  const main = document.getElementById('main');
  main.innerHTML = '';

  data.haltestellen.forEach(stop => {
    const block = document.createElement('div');
    block.className = 'stop-block';

    const hdr = document.createElement('div');
    hdr.className = 'stop-header';
    hdr.innerHTML = `
      ${stop.uhrzeit ? `<div class="stop-time-pill">${stop.uhrzeit}</div>` : ''}
      <div>
        <div class="stop-name">${stop.ort}</div>
        <div class="stop-count">${stop.fahrgaeste.length} Personen</div>
      </div>`;
    block.appendChild(hdr);

    const list = document.createElement('div');
    list.className = 'pax-list';

    stop.fahrgaeste.forEach(p => {
      total++;
      const row = document.createElement('div');
      row.className = 'pax-row';
      row.dataset.key = (p.sitz || '') + '_' + p.name;
      row.innerHTML = `
        ${p.sitz ? `<div class="seat-badge">${p.sitz}</div>` : ''}
        <div class="pax-name">${p.name}</div>
        <div class="absent-tag">Abwesend</div>
        <div class="check-ring">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M1.5 6L4.5 9L10.5 3" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>`;
      row.onclick = () => {
        if (row.classList.contains('checked')) {
          row.classList.remove('checked'); row.classList.add('absent'); checked--;
        } else if (row.classList.contains('absent')) {
          row.classList.remove('absent');
        } else {
          row.classList.add('checked'); checked++;
        }
        saveState(); update();
      };
      list.appendChild(row);
    });

    block.appendChild(list);
    main.appendChild(block);
  });

  document.getElementById('load-screen').style.display = 'none';
  document.getElementById('list-view').style.display = 'block';
  document.getElementById('bottom-bar').style.display = 'flex';

  loadState();
  update();
}

function saveState() {
  const state = {};
  document.querySelectorAll('.pax-row').forEach(r => {
    state[r.dataset.key] = r.classList.contains('checked') ? 'checked' : r.classList.contains('absent') ? 'absent' : '';
  });
  localStorage.setItem(listKey, JSON.stringify(state));
}

function loadState() {
  const saved = localStorage.getItem(listKey);
  if (!saved) return;
  const state = JSON.parse(saved);
  document.querySelectorAll('.pax-row').forEach(r => {
    if (state[r.dataset.key] === 'checked') { r.classList.add('checked'); checked++; }
    else if (state[r.dataset.key] === 'absent') r.classList.add('absent');
  });
}

function update() {
  const absent = document.querySelectorAll('.pax-row.absent').length;
  const effective = total - absent;
  document.getElementById('progress').style.width = (effective > 0 ? checked/effective*100 : 0) + '%';
  document.getElementById('badge').textContent = checked + '/' + effective;
  const ai = document.getElementById('absent-info');
  if (absent > 0) { ai.textContent = absent + ' abwesend'; ai.style.display = 'block'; }
  else ai.style.display = 'none';
}

function resetAll() {
  if (!confirm('Alle Häkchen entfernen?')) return;
  document.querySelectorAll('.pax-row.checked, .pax-row.absent').forEach(r => r.classList.remove('checked','absent'));
  checked = 0; localStorage.removeItem(listKey); update();
}

function clearList() {
  if (!confirm('Liste entfernen und neue laden?')) return;
  localStorage.removeItem(listKey);
  total = 0; checked = 0; listKey = '';
  document.getElementById('main').innerHTML = '';
  document.getElementById('trip-banner').style.display = 'none';
  document.getElementById('list-view').style.display = 'none';
  document.getElementById('bottom-bar').style.display = 'none';
  document.getElementById('load-screen').style.display = 'flex';
  document.getElementById('error-box').style.display = 'none';
  document.getElementById('badge').textContent = '–';
  document.title = 'Einstiegsliste';
}
</script>
</body>
</html>
